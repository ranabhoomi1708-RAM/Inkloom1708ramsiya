label: "inspired by CCPA Guidelines for Prevention and Regulation of Dark Patterns 2023, checklist aid, not legal advice"
pack: "dark_patterns"
disclaimer: "checklist aid, not legal advice"

rules:
  - id: "DP-URG-01"
    title: "False Urgency and Artificial Scarcity"
    category: "dark_patterns"
    severity: "high"
    type: "regulatory"
    triggers:
      - "only 2 left"
      - "only 1 left"
      - "only \\d+ left"
      - "expires in 5 minutes"
      - "hurry before it's gone"
      - "countdown ends"
      - "flash sale ending"
      - "in high demand - act now"
      - "selling out fast"
    explanation_template: "Artificial scarcity or fake urgency countdowns deceive buyers into impulse purchasing without factual stock verification."
    why_hurts_trust: "Consumers who discover recurring 'limited' sales realize they were manipulated, permanently damaging their confidence in brand honesty."
    source_label: "CCPA Dark Patterns Guidelines Annexure 1 (False Urgency)"

  - id: "DP-SHM-02"
    title: "Confirmshaming and Guilt-Based Manipulation"
    category: "dark_patterns"
    severity: "medium"
    type: "tone"
    triggers:
      - "no thanks, i hate saving money"
      - "no thanks, i prefer paying full price"
      - "no, i don't want clear skin"
      - "no, i hate discounts"
      - "no thanks, i like wrinkles"
      - "i don't care about my skin"
    explanation_template: "Confirmshaming uses guilt, shame, or mockery to coerce users into opting in or abandoning opt-out buttons."
    why_hurts_trust: "Condescending user choices creates immediate resentment and brands the company as disrespectful."
    source_label: "CCPA Dark Patterns Guidelines Annexure 4 (Confirmshaming)"

  - id: "DP-BTS-03"
    title: "Bait and Switch Pricing"
    category: "dark_patterns"
    severity: "high"
    type: "regulatory"
    triggers:
      - "starts at just"
      - "selected models only"
      - "subject to availability at checkout"
      - "advertised price requires"
    explanation_template: "Advertising attractive prices or terms that are unavailable or replaced with higher costs at checkout constitutes bait-and-switch."
    why_hurts_trust: "Luring customers with phantom offers destroys consumer goodwill and triggers regulatory complaints."
    source_label: "CCPA Dark Patterns Guidelines Annexure 3 (Bait and Switch)"

  - id: "DP-DRP-04"
    title: "Drip Pricing and Concealed Fees"
    category: "dark_patterns"
    severity: "high"
    type: "regulatory"
    triggers:
      - "plus handling fee"
      - "convenience fee added at payment"
      - "mandatory service charge extra"
      - "taxes and fees calculated later"
      - "extra packaging charge"
    explanation_template: "Concealing mandatory fees until the final payment step misleads consumers regarding true total costs."
    why_hurts_trust: "Surprise checkout charges trigger cart abandonment and leave buyers feeling swindled."
    source_label: "CCPA Dark Patterns Guidelines Annexure 5 (Drip Pricing)"

  - id: "DP-DSG-05"
    title: "Disguised Advertisements"
    category: "dark_patterns"
    severity: "high"
    type: "regulatory"
    triggers:
      - "recommended story"
      - "suggested reading"
      - "user post"
      - "editorial pick"
      - "sponsored content disguised"
    explanation_template: "Paid promotional advertisements masked as independent editorial or organic content mislead consumers."
    why_hurts_trust: "Readers who discover an article was secretly sponsored lose respect for both publisher and brand."
    source_label: "CCPA Dark Patterns Guidelines Annexure 6 (Disguised Advertisements)"

  - id: "DP-TRP-06"
    title: "Subscription Trap and Forced Continuity"
    category: "dark_patterns"
    severity: "high"
    type: "regulatory"
    triggers:
      - "auto-renews monthly"
      - "free trial auto-renews"
      - "credit card required for free trial"
      - "cancel anytime by calling"
      - "automatic billing unless cancelled"
    explanation_template: "Enrolling users in recurring charges without prominent disclosures or making cancellation intentionally difficult is a subscription trap."
    why_hurts_trust: "Forced subscriptions result in immediate chargebacks, toxic reviews, and customer hostility."
    source_label: "CCPA Dark Patterns Guidelines Annexure 7 (Subscription Traps)"
