label: "inspired by ASCI Chapter IV and Fair Competition Principles, checklist aid, not legal advice"
pack: "comparative_claims"
disclaimer: "checklist aid, not legal advice"

rules:
  - id: "CMP-PAR-01"
    title: "Unfair Product Comparison and Disparagement"
    category: "comparative_claims"
    severity: "medium"
    type: "claim"
    triggers:
      - "better than other brands"
      - "unlike harmful ordinary creams"
      - "toxic competitor products"
      - "beats all rivals"
      - "superior to leading market brands"
    explanation_template: "Comparative statements must compare verified, like-for-like features and must not disparage competitors' goods unfairly."
    why_hurts_trust: "Smearing market competitors appears insecure and often leads to competitor litigation and consumer skepticism."
    source_label: "ASCI Code Chapter IV.1"

  - id: "CMP-PAR-02"
    title: "Unsubstantiated Market Leader / #1 Claims"
    category: "comparative_claims"
    severity: "high"
    type: "claim"
    triggers:
      - "india's #1"
      - "number 1 brand"
      - "market leader in"
      - "largest selling"
      - "most loved brand"
    explanation_template: "Market leadership claims (#1, highest selling) require independent market research source validation (e.g. Nielsen, Kantar, Euromonitor) with date range."
    why_hurts_trust: "Claiming leadership without cited third-party sales data discredits legitimate brand achievements."
    source_label: "ASCI Code Chapter I.4"
