label: "inspired by WCAG 2.1 Guidelines and Plain Language Standards, checklist aid, not legal advice"
pack: "accessibility_copy"
disclaimer: "checklist aid, not legal advice"

rules:
  - id: "ACC-CAP-01"
    title: "Excessive ALL CAPS Text"
    category: "accessibility_copy"
    severity: "low"
    type: "accessibility"
    triggers:
      - "\\b[A-Z]{5,}\\b"
      - "BUY NOW OR MISS OUT"
      - "LIMITED TIME ONLY"
      - "EXCLUSIVE OFFER FOR YOU"
    explanation_template: "Sentences in full capital letters degrade readability, trigger screen-reader shouting, and feel aggressive to users."
    why_hurts_trust: "Shouting in copy repels readers and creates a stressful, spammy brand perception."
    source_label: "WCAG 2.1 Guideline 3.1 & Plain Writing Principles"

  - id: "ACC-JRG-02"
    title: "Dense Pseudo-Scientific Jargon"
    category: "accessibility_copy"
    severity: "medium"
    type: "terminology"
    triggers:
      - "cellular bio-synergistic"
      - "quantum trans-epidermal"
      - "nanosphere encapsulation matrix"
      - "mitochondrial dermis rejuvenation"
      - "chrono-active bio-complex"
    explanation_template: "Overly complex or fabricated pseudo-scientific jargon obscures real ingredient benefits and confuses consumers."
    why_hurts_trust: "Technobabble sounds deceptive and prevents shoppers from making informed purchasing decisions."
    source_label: "Plain Language Action and Information Network"

  - id: "ACC-RED-03"
    title: "Overly Complex Reading Level in Consumer Instructions"
    category: "accessibility_copy"
    severity: "low"
    type: "accessibility"
    triggers:
      - "contraindicated pursuant to"
      - "concomitant administration with"
      - "utilization of aforementioned emulsion"
    explanation_template: "Consumer instructions and warnings must use clear, accessible plain language suitable for general comprehension."
    why_hurts_trust: "Dense academic phrasing leads to user misuse and safety complications."
    source_label: "Clear Writing Guidelines"
