label: "inspired by the ASCI Code and CCPA Guidelines 2022, checklist aid, not legal advice"
pack: "india_ads"
disclaimer: "checklist aid, not legal advice"

rules:
  - id: "IND-SUB-01"
    title: "Substantiation of Quantitative Efficacy Claims"
    category: "india_ads"
    severity: "high"
    type: "claim"
    triggers:
      - "%"
      - "percent"
      - "lesion"
      - "reduction"
      - "tested"
      - "proven"
      - "trial"
      - "results in"
      - "\\b(?:in|within)\\s+\\d+\\s+days?\\b"
    explanation_template: "Quantitative efficacy claims (percentages, timelines, lesion reduction) must be substantiated with reliable, independent clinical trial evidence."
    why_hurts_trust: "Consumers who buy based on unproven numerical promises feel deceived and abandon the brand when results fall short."
    source_label: "ASCI Code Chapter I & CCPA 2022 Guidelines"

  - id: "IND-ABS-02"
    title: "Prohibition of Absolute Miracle Guarantees"
    category: "india_ads"
    severity: "high"
    type: "claim"
    triggers:
      - "100%"
      - "permanent"
      - "permanently"
      - "completely removes"
      - "guaranteed cure"
      - "eradicates forever"
      - "instant cure"
      - "miracle"
      - "magic"
    explanation_template: "Absolute guarantees of 100% cure, complete elimination of conditions, or permanent eradication are deceptive and prohibited."
    why_hurts_trust: "Miracle guarantees set unrealistic expectations and directly damage brand credibility when physiological variance leads to different outcomes."
    source_label: "ASCI Code Chapter I.4 & Drugs and Magic Remedies Act"

  - id: "IND-HLT-03"
    title: "Health & Dermatological Results Needing Sunscreen Warning"
    category: "india_ads"
    severity: "high"
    type: "regulatory"
    triggers:
      - "salicylic"
      - "willow bark"
      - "willow extract"
      - "glycolic"
      - "aha"
      - "bha"
      - "chemical peel"
      - "retinol"
      - "retinoid"
      - "exfoliant"
    requires_accompanying:
      - "spf"
      - "sunscreen"
      - "sun protection"
    explanation_template: "Products with active chemical exfoliants or photosensitizing actives must disclose mandatory daytime sun protection (SPF)."
    why_hurts_trust: "Omitting sun warnings risks consumer chemical burns or hyperpigmentation, causing direct physical harm and brand liability."
    source_label: "ASCI Dermatological Safety & CCPA Consumer Protection"

  - id: "IND-DISC-04"
    title: "Disclaimer Legibility and Prominence"
    category: "india_ads"
    severity: "medium"
    type: "regulatory"
    triggers:
      - "*conditions apply"
      - "*terms apply"
      - "see back of pack"
      - "fine print"
      - "\\*\\s*t&c"
    explanation_template: "Qualifications and disclaimers must be prominent, easily readable, and placed close to the headline claim rather than buried."
    why_hurts_trust: "Hiding material conditions behind tiny asterisks signals deceptive intent and breeds immediate customer skepticism."
    source_label: "ASCI Guidelines on Disclaimers 2023"

  - id: "IND-INF-05"
    title: "Influencer and Endorsement Disclosure"
    category: "india_ads"
    severity: "high"
    type: "regulatory"
    triggers:
      - "influencer"
      - "brand ambassador"
      - "sponsored"
      - "partnership"
      - "endorsed by"
      - "collab"
    explanation_template: "Commercial partnerships and endorsements must carry prominent upfront disclosure labels (#Ad, #Sponsored, #Collab)."
    why_hurts_trust: "Surreptitious advertising breaches audience trust and violates regulatory transparency mandates."
    source_label: "ASCI Guidelines for Influencer Advertising 2021"

  - id: "IND-CMP-06"
    title: "Comparative Advertising Fairness"
    category: "india_ads"
    severity: "medium"
    type: "claim"
    triggers:
      - "better than"
      - "superior to"
      - "unlike other brands"
      - "leading brand"
      - "beats competitors"
    explanation_template: "Comparative claims must compare like products on identical, verified parameters and avoid unfair disparagement."
    why_hurts_trust: "Unsubstantiated attacks on competitors look defensive and attract regulatory scrutiny or legal challenges."
    source_label: "ASCI Code Chapter IV on Comparative Advertising"

  - id: "IND-FRE-07"
    title: "Free Offer & Promotional Conditions Transparency"
    category: "india_ads"
    severity: "medium"
    type: "regulatory"
    triggers:
      - "free"
      - "risk-free"
      - "zero cost"
      - "complimentary gift"
      - "money-back guarantee"
    explanation_template: "When items are claimed 'free' or 'risk-free', consumers must not incur undisclosed charges, and all conditions must be stated alongside."
    why_hurts_trust: "Hidden costs on 'free' offers trigger immediate feelings of bait-and-switch betrayal."
    source_label: "CCPA Guidelines for Prevention of Misleading Advertisements 2022"
