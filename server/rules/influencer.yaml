label: "inspired by ASCI Influencer Guidelines and CCPA Endorsement Rules, checklist aid, not legal advice"
pack: "influencer"
disclaimer: "checklist aid, not legal advice"

rules:
  - id: "INF-DSC-01"
    title: "Mandatory Influencer Material Connection Disclosure"
    category: "influencer"
    severity: "high"
    type: "regulatory"
    triggers:
      - "use my code"
      - "my promo code"
      - "link in bio"
      - "swipe up"
      - "loving this brand"
      - "obsessed with this"
      - "my holy grail"
      - "collab with"
      - "gifted by"
    requires_accompanying:
      - "#ad"
      - "#sponsored"
      - "#paidpartnership"
      - "paid partnership"
      - "#collab"
      - "#partner"
    explanation_template: "Influencer marketing posts must clearly and prominently display an upfront disclosure label (#Ad, #Sponsored, Paid partnership) before the fold."
    why_hurts_trust: "Stealth sponsorships leave audiences feeling tricked once they realize genuine enthusiasm was financially compensated."
    source_label: "ASCI Influencer Guidelines 2021 & CCPA Endorsements Code"

  - id: "INF-TYP-02"
    title: "Testimonial Typicality and 'Results Not Typical' Disclosure"
    category: "influencer"
    severity: "medium"
    type: "claim"
    triggers:
      - "lost 10kg in 10 days"
      - "cleared my acne in 48 hours"
      - "transformed overnight"
      - "results may vary"
      - "my personal miracle"
    explanation_template: "Extraordinary testimonial outcomes must carry prominent disclosures that results are not typical and state expected median results."
    why_hurts_trust: "Highlighting exceptional outlier experiences leads everyday customers to disappointment and accusations of deceit."
    source_label: "FTC Endorsement Guides & ASCI Chapter I"

  - id: "INF-DUE-03"
    title: "Influencer Due Diligence and Authentic Experience"
    category: "influencer"
    severity: "high"
    type: "regulatory"
    triggers:
      - "i use this every single day"
      - "cured my skin condition"
      - "recommended by all top creators"
    explanation_template: "Endorsers must have genuinely used the product and verify that claims reflect their honest, current belief and experience."
    why_hurts_trust: "When creators praise products they never touched, audience exposure inevitably damages both the influencer and brand."
    source_label: "CCPA Guidelines on Endorsements 2022"
