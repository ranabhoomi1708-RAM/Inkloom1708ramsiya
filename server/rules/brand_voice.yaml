label: "inspired by Inkloom Brand Voice & Dermatological Communication Standards, checklist aid, not legal advice"
pack: "brand_voice"
disclaimer: "checklist aid, not legal advice"

rules:
  - id: "BV-SHM-01"
    title: "Body Shaming and Problem-Magnifying Copy"
    category: "brand_voice"
    severity: "high"
    type: "tone"
    triggers:
      - "ugly craters"
      - "dirty skin"
      - "disgusting acne"
      - "gross blemishes"
      - "embarrassing scars"
      - "hideous pores"
      - "ashamed of your face"
    explanation_template: "Dermatological copy must be empathetic and supportive, strictly avoiding derogatory or shame-inducing descriptors of skin conditions."
    why_hurts_trust: "Shaming consumer insecurities damages brand affinity and repels self-respecting customers."
    source_label: "Inkloom Brand Voice Standards"

  - id: "BV-HYP-02"
    title: "Hyperbolic Flawless Promises"
    category: "brand_voice"
    severity: "high"
    type: "tone"
    triggers:
      - "flawless glass skin"
      - "zero blemishes forever"
      - "poreless perfection"
      - "miracle cure"
      - "magic potion"
      - "instant transformation"
    explanation_template: "Avoid sensationalist hyperbole ('poreless perfection', 'miracle cure'); focus on authentic, achievable skin health."
    why_hurts_trust: "Promising impossible perfection guarantees customer disillusionment when normal skin texture remains."
    source_label: "Inkloom Scientific Tone Guidelines"

  - id: "BV-VEG-03"
    title: "Cruelty-Free & Vegan Substantiation"
    category: "brand_voice"
    severity: "medium"
    type: "regulatory"
    triggers:
      - "100% vegan"
      - "cruelty-free"
      - "leaping bunny certified"
      - "peta approved"
      - "never tested on animals"
    explanation_template: "Cruelty-free and vegan certifications must be verified against current third-party audit reports."
    why_hurts_trust: "Ethical consumers prioritize animal welfare and will boycott brands caught misrepresenting cruelty-free status."
    source_label: "Inkloom Ethical Sourcing Guidelines"
