label: "inspired by ISO Quality Management and Brand Governance, checklist aid, not legal advice"
pack: "outdated_info"
disclaimer: "checklist aid, not legal advice"

rules:
  - id: "OUT-EXP-01"
    title: "Expired or Superseded Clinical Dossiers"
    category: "outdated_info"
    severity: "medium"
    type: "claim"
    triggers:
      - "2019 study"
      - "2020 study"
      - "2021 study"
      - "2022 study"
      - "preliminary trial"
      - "study from 5 years ago"
    explanation_template: "Claims resting on outdated or superseded research findings must be refreshed against active, valid clinical files."
    why_hurts_trust: "Relying on expired trial data makes a brand look stagnant and uncommitted to ongoing scientific rigor."
    source_label: "Inkloom Governance & Data Currency Policy"

  - id: "OUT-PRC-02"
    title: "Stale Pricing or Past Offer Terms"
    category: "outdated_info"
    severity: "high"
    type: "regulatory"
    triggers:
      - "festive sale 2023"
      - "diwali 2023"
      - "old price"
      - "valid until 2022"
      - "valid until 2023"
    explanation_template: "Displaying expired promotional deadlines or obsolete price figures causes confusion and transaction failures."
    why_hurts_trust: "Customers trying to claim outdated discounts end up frustrated and abandon carts."
    source_label: "Consumer Protection Fair Trade Standards"
