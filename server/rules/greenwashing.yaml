label: "inspired by ASCI Environmental Claims Code and CCPA Greenwashing Guidelines 2024, checklist aid, not legal advice"
pack: "greenwashing"
disclaimer: "checklist aid, not legal advice"

rules:
  - id: "GW-GEN-01"
    title: "Vague Environmental and Eco-Friendly Claims"
    category: "greenwashing"
    severity: "high"
    type: "claim"
    triggers:
      - "eco-friendly"
      - "environmentally friendly"
      - "green product"
      - "planet positive"
      - "earth safe"
      - "good for the planet"
      - "sustainable formula"
    explanation_template: "Broad, generic terms like 'eco-friendly' or 'green' without specific, verifiable lifecycle metrics constitute unsubstantiated greenwashing."
    why_hurts_trust: "Consumers and regulators increasingly see through hollow buzzwords, leading to cynicism and loss of eco-conscious buyers."
    source_label: "ASCI Guidelines on Environmental and Green Claims 2024"

  - id: "GW-NAT-02"
    title: "Unsubstantiated 'Natural' and 'Pure' Claims"
    category: "greenwashing"
    severity: "medium"
    type: "claim"
    triggers:
      - "100% natural"
      - "all natural"
      - "pure nature"
      - "chemical free"
      - "zero chemicals"
      - "toxin free"
    explanation_template: "Claims of '100% natural' or 'chemical free' are scientifically unfounded as all matter consists of chemicals, and plant extracts require preservative stabilizers."
    why_hurts_trust: "Chemophobia marketing misleads customers about product safety and alienates scientifically literate consumers."
    source_label: "ASCI Guidelines on Natural / Organic Cosmetics"

  - id: "GW-ORG-03"
    title: "Uncertified Organic Claims"
    category: "greenwashing"
    severity: "high"
    type: "regulatory"
    triggers:
      - "certified organic"
      - "100% organic"
      - "organically grown"
      - "organic formula"
    explanation_template: "Organic claims require explicit certification from accredited certifying bodies (e.g. USDA Organic, ECOCERT, India Organic) with registration numbers cited."
    why_hurts_trust: "Unverified organic assertions risk legal penalties and destroy integrity with premium wellness consumers."
    source_label: "FSSAI Jaivik Bharat / National Programme for Organic Production"

  - id: "GW-REC-04"
    title: "Unsubstantiated Recycled or Biodegradable Packaging Claims"
    category: "greenwashing"
    severity: "medium"
    type: "claim"
    triggers:
      - "100% biodegradable"
      - "biodegradable packaging"
      - "100% recyclable"
      - "ocean plastic"
      - "recycled material"
    explanation_template: "Biodegradable and recyclable claims must specify the component (bottle, cap, box), conditions required, and post-consumer recycled percentage."
    why_hurts_trust: "Misleading recycling claims lead to improper disposal and expose the brand to greenwashing backlash."
    source_label: "Plastic Waste Management Rules & CCPA Guidelines 2024"

  - id: "GW-NEU-05"
    title: "Unsubstantiated Carbon Neutral or Net Zero Claims"
    category: "greenwashing"
    severity: "high"
    type: "claim"
    triggers:
      - "carbon neutral"
      - "zero carbon"
      - "net zero product"
      - "climate positive"
    explanation_template: "Carbon neutral claims require verified greenhouse gas accounting across Scope 1-3 emissions and certified offset disclosures."
    why_hurts_trust: "Unbacked net-zero declarations invite investigations from climate watchdogs and greenwashing litigation."
    source_label: "ISO 14068 / CCPA Environmental Guidelines"
