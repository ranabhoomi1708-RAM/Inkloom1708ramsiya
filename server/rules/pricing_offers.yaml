label: "inspired by Legal Metrology (Packaged Commodities) Rules and Consumer Protection Act, checklist aid, not legal advice"
pack: "pricing_offers"
disclaimer: "checklist aid, not legal advice"

rules:
  - id: "PRC-MRP-01"
    title: "Strike-Through MRP and Artificial Discounting"
    category: "pricing_offers"
    severity: "high"
    type: "regulatory"
    triggers:
      - "mrp ₹"
      - "was ₹"
      - "flat 80% off mrp"
      - "inflated mrp"
      - "save ₹"
    explanation_template: "Strike-through pricing or comparative discounts must be based on genuine Maximum Retail Price or recent regular selling price, not inflated baselines."
    why_hurts_trust: "Consumers recognize exaggerated MRPs as artificial discounts, eroding faith in fair pricing."
    source_label: "Legal Metrology Rules 2011 & CCPA Pricing Guidelines"

  - id: "PRC-FRE-02"
    title: "Free Offer with Hidden Conditions"
    category: "pricing_offers"
    severity: "high"
    type: "regulatory"
    triggers:
      - "free gift"
      - "100% free"
      - "get it free"
      - "free sample"
      - "buy 1 get 1 free"
    explanation_template: "Promotions labeled 'free' must disclose all mandatory charges (such as delivery fees or minimum cart thresholds) upfront."
    why_hurts_trust: "Customers discovering surprise shipping or qualification criteria feel tricked into purchasing."
    source_label: "CCPA Misleading Advertisements Guidelines 2022"

  - id: "PRC-STA-03"
    title: "Ambiguous 'Starting At' Pricing"
    category: "pricing_offers"
    severity: "medium"
    type: "regulatory"
    triggers:
      - "starting at ₹"
      - "starts from ₹"
      - "as low as ₹"
      - "prices starting"
    explanation_template: "'Starting at' prices must correspond to readily available variants in stock, not rare out-of-stock SKUs."
    why_hurts_trust: "Showing ultra-low prices that don't exist when clicked frustrates potential buyers."
    source_label: "ASCI Code on Pricing Transparency"

  - id: "PRC-TAX-04"
    title: "Mandatory Tax-Inclusive Price Disclosure"
    category: "pricing_offers"
    severity: "high"
    type: "regulatory"
    triggers:
      - "exclusive of gst"
      - "plus gst"
      - "taxes extra"
      - "+ taxes"
    explanation_template: "Consumer retail prices must explicitly state whether GST/taxes are included or state the inclusive final price."
    why_hurts_trust: "Adding surprise taxes at the terminal stage makes checkout feel untransparent and gouging."
    source_label: "Legal Metrology Act & Consumer Goods Standards"

  - id: "PRC-LIM-05"
    title: "Unqualified 'Limited Stock' Claims"
    category: "pricing_offers"
    severity: "medium"
    type: "regulatory"
    triggers:
      - "limited stock available"
      - "while stocks last"
      - "limited edition run"
    explanation_template: "Limited availability claims must reflect verified inventory numbers and reasonable production runs."
    why_hurts_trust: "Perpetual 'limited stock' banners destroy urgency credibility when seen year-round."
    source_label: "CCPA Dark Patterns (Scarcity Provisions)"
