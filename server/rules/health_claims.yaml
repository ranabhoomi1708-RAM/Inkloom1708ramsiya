label: "inspired by Drugs and Cosmetics Act and ASCI Healthcare Guidelines, checklist aid, not legal advice"
pack: "health_claims"
disclaimer: "checklist aid, not legal advice"

rules:
  - id: "HLT-BA-01"
    title: "Misleading Before and After Visuals / Timeframes"
    category: "health_claims"
    severity: "high"
    type: "claim"
    triggers:
      - "before and after"
      - "before/after"
      - "see the difference in 3 days"
      - "transformation in 1 week"
      - "rapid transformation"
    explanation_template: "Before-and-after representations must depict genuine, unretouched results achieved under standard use within clinically documented periods."
    why_hurts_trust: "Photoshopped or lighting-manipulated comparisons create unachievable expectations that result in refund requests and brand distrust."
    source_label: "ASCI Guidelines on Skin & Beauty Advertising"

  - id: "HLT-DOC-02"
    title: "Unverified Dermatologist or Doctor Endorsements"
    category: "health_claims"
    severity: "high"
    type: "claim"
    triggers:
      - "recommended by dermatologists"
      - "doctor recommended"
      - "dermatologist approved"
      - "dr approved"
      - "#1 doctor choice"
      - "pediatrician recommended"
    explanation_template: "Claims of healthcare practitioner or dermatologist endorsements must be supported by statistically valid, independent practitioner survey dossiers."
    why_hurts_trust: "Fabricating medical consensus degrades consumer safety and invites heavy regulatory sanctions."
    source_label: "National Medical Commission & ASCI Code Chapter I"

  - id: "HLT-CLN-03"
    title: "'Clinically Proven' Claims Without Cited Study"
    category: "health_claims"
    severity: "high"
    type: "claim"
    triggers:
      - "clinically proven"
      - "clinically tested"
      - "clinical trials show"
      - "dermatologically tested"
    explanation_template: "'Clinically proven' assertions require explicit citation of clinical trial methodology, sample size (n), and study registry details."
    why_hurts_trust: "Using pseudo-scientific jargon without documented study evidence undermines trust among discerning consumers."
    source_label: "ASCI Code Chapter I.1 on Substantiation"

  - id: "HLT-CUR-04"
    title: "Therapeutic or Disease Cure Claims for Cosmetics"
    category: "health_claims"
    severity: "high"
    type: "regulatory"
    triggers:
      - "cures eczema"
      - "treats psoriasis"
      - "cures dermatitis"
      - "heals acne scars permanently"
      - "cures rosacea"
    explanation_template: "Cosmetic preparations cannot claim to cure, prevent, or treat physiological medical conditions or chronic diseases."
    why_hurts_trust: "Conflating cosmetics with prescription medical remedies puts consumers at medical risk and violates drug licensing laws."
    source_label: "Drugs and Cosmetics Act 1940"
